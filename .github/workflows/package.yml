name: Publish to npm
on:
  # Allows triggering both from release-please workflow and manually
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Git ref to build from (tag or branch)"
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    if: (github.event_name == 'workflow_dispatch' || startsWith(github.git_ref, 'refs/tags/'))

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.git_ref }}

      - name: Setup Node.js and .npmrc
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          # needed to publish to npm registry
          registry-url: "https://registry.npmjs.org"
          scope: "@openfoodfacts"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build

      - name: Run tests
        run: yarn test

      - name: Publish to npm
        run: yarn npm publish --access public --provenance
        env:
          NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
