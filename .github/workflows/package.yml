name: Publish to npm
on:
  # Trigger on successful completion of release-please workflow
  workflow_run:
    workflows: [release-please]
    types: [completed]

  # Allows manual triggering
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    # We want to run this job only when
    # - the workflow is manually triggered
    # - the release-please workflow has completed successfully and created a release
    if: |
      (github.event_name == 'workflow_dispatch' && startsWith(github.event.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.outputs.release_created)

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.outputs.sha || github.event.ref }}

      - name: Setup Node.js and .npmrc
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          # needed to publish to npm registry
          registry-url: "https://registry.npmjs.org"
          scope: "@openfoodfacts"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build

      - name: Run tests
        run: yarn test

      - name: Publish to npm
        run: yarn npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
